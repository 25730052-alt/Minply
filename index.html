<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>나만의 모바일 티켓북 & 실관람평 다이어리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex justify-center items-center min-h-screen p-0 bg-gray-200" data-page="home" data-root="">

  <!-- Mobile Device Wrapper -->
  <div class="app">
    <header class="bar">
      <h1 class="bar__title brand"><i class="fa-solid fa-film" aria-hidden="true"></i>FILM LOG</h1>
      <a class="avatar" id="avatarBtn" href="pages/login.html" aria-label="로그인"></a>
    </header>

    <main class="body">
      <section class="hero">
        <div class="hero__copy">
          <p class="hero__tag"><i class="fa-solid fa-film" aria-hidden="true"></i> FILM LOG <span>/</span> PERSONAL ARCHIVE</p>
          <h2 class="hero__title">영화 포스터로<br>남기는 관람 기록</h2>
          <p class="hero__desc">좋아한 장면과 감상을<br>나만의 티켓으로 모아보세요.</p>
        </div>
        <div class="hero__mark" aria-hidden="true">
          <i class="fa-solid fa-ticket"></i>
          <span>MY<br>ARCHIVE</span>
          <strong>01</strong>
        </div>
      </section>

      <a class="searchbtn" href="pages/search.html">
        <span><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>영화 검색 바로가기</span>
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </a>

      <div class="sec-head">
        <h3>최근 저장한 티켓</h3>
        <a class="link" href="pages/ticketbook.html">전체보기</a>
      </div>
      <div class="strip" id="homeRecent"></div>

      <section aria-labelledby="communityTitle">
        <div class="sec-head">
          <div>
            <h3 id="communityTitle">관객 관람평 랭킹</h3>
            <p class="community-note">평점·인기도 및 관람평은 예시 데이터입니다.</p>
          </div>
        </div>
        <div class="seg community-sort" role="group" aria-label="관람평 정렬">
          <button type="button" class="is-on" data-review-sort="rating" aria-pressed="true">평점순</button>
          <button type="button" data-review-sort="popularity" aria-pressed="false">인기도순</button>
        </div>
        <ol class="community-list" id="communityReviews"></ol>
      </section>
    </main>

    <nav class="tabbar" aria-label="하단 메뉴">
      <a href="index.html" class="is-on" aria-current="page"><i class="fa-solid fa-house" aria-hidden="true"></i>홈</a>
      <a href="pages/search.html"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>검색</a>
      <a href="pages/ticketbook.html"><i class="fa-solid fa-ticket" aria-hidden="true"></i>마이 티켓북</a>
    </nav>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
