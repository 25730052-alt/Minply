<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ticketbook - 나만의 모바일 티켓북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="flex justify-center items-center min-h-screen p-0 bg-gray-200">
    <div class="w-full max-w-md h-screen bg-white overflow-hidden flex flex-col relative">
        <header class="bg-white px-4 py-3 border-b border-gray-200 flex items-center justify-between">
            <h1 class="font-bold text-lg text-gray-800">Ticketbook</h1>
            <a href="../index.html" class="text-xs text-gray-500 hover:text-gray-800">홈으로</a>
        </header>
        <main class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="border border-gray-300 p-6 text-center text-gray-500">
                <p class="font-bold text-base">Ticketbook 와이어프레임 페이지</p>
                <p class="text-xs mt-2">상세 기능 및 뷰 레이아웃이 배치되는 공간입니다.</p>
            </div>
        </main>
        <nav class="bg-white border-t border-gray-200 px-6 py-2 flex justify-between items-center text-gray-500">
            <a href="../index.html" class="flex flex-col items-center hover:text-gray-900">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1">홈</span>
            </a>
            <a href="ticketbook.html" class="flex flex-col items-center text-gray-900 font-bold">
                <i class="fa-solid fa-book-bookmark text-lg"></i>
                <span class="text-[10px] mt-1">티켓북</span>
            </a>
            <a href="calendar.html" class="flex flex-col items-center hover:text-gray-900">
                <i class="fa-solid fa-calendar-days text-lg"></i>
                <span class="text-[10px] mt-1">달력</span>
            </a>
            <a href="mypage.html" class="flex flex-col items-center hover:text-gray-900">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] mt-1">마이</span>
            </a>
        </nav>
    </div>
</body>
</html>
