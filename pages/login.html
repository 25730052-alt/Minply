<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>로그인 - 나만의 모바일 티켓북</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="flex justify-center items-center min-h-screen p-0 bg-gray-200" data-page="login" data-root="../">

  <!-- Mobile Device Wrapper -->
  <div class="app">
    <header class="bar">
      <a class="iconbtn" href="../index.html" id="loginClose" aria-label="닫기">✕</a>
      <h1 class="bar__title">로그인/회원가입</h1>
      <span class="bar__space"></span>
    </header>

    <form class="body body--center" id="loginForm" novalidate>
      <div class="logo" role="img" aria-label="FILM LOG">
        <i class="fa-solid fa-film" aria-hidden="true"></i>
        <span aria-hidden="true">FILM LOG</span>
      </div>
      <h2 class="login__title">닉네임으로<br>내 티켓북을 시작하세요</h2>
      <p class="notice" id="loginReason"></p>

      <label class="lb" for="nickname">닉네임</label>
      <input class="input" type="text" id="nickname" placeholder="닉네임을 입력하세요" autocomplete="username" maxlength="20" required>
      <label class="lb" for="password">비밀번호</label>
      <div class="pw">
        <input class="input" type="password" id="password" placeholder="영문자와 숫자 조합, 8자 이상" autocomplete="current-password" minlength="8" maxlength="64" required>
        <button type="button" class="pw__toggle" id="pwToggle">표시</button>
      </div>

      <p class="formerr" id="authError" role="alert" hidden></p>
      <button type="submit" class="btn btn--dark btn--full" id="loginSubmit">로그인</button>
      <div class="loginlinks">
        <button type="button" class="link" id="modeToggle">회원가입</button>
      </div>
    </form>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
